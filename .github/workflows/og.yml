name: Vista previa de empresas
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: og
jobs:
  og:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Generar imágenes y páginas de las empresas que cambiaron
        run: python og/generar.py
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          API_SECRET: ${{ secrets.API_SECRET }}
          ANON_KEY: ${{ secrets.ANON_KEY }}
          OG_SECRET: ${{ secrets.OG_SECRET }}
      - name: Publicar si hubo cambios
        run: |
          git config user.name "Polla Prodes (automático)"
          git config user.email "pollaprodes@users.noreply.github.com"
          git add -A og */index.html
          git diff --cached --quiet && echo "SIN_CAMBIOS=1" >> $GITHUB_ENV || (git commit -m "Vista previa de empresas actualizada" && git push && echo "PUBLICAR=1" >> $GITHUB_ENV)
      - name: Publicar en Cloudflare
        if: env.PUBLICAR == '1'
        run: |
          mkdir /tmp/sitio && git archive HEAD | tar -x -C /tmp/sitio && rm -rf /tmp/sitio/.github /tmp/sitio/index.ts /tmp/sitio/CNAME /tmp/sitio/og/generar.py /tmp/sitio/og/estado.json
          npx -y wrangler@4 pages deploy /tmp/sitio --project-name pollaprodes --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
