body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

<script>
/* Dirección de empresa: pollaprodes.ar/norte → abre la Polla de esa empresa (?e=NORTE). Sirve igual en gr10-cdu.github.io/PollaProdes/norte */
(function(){var p=location.pathname,base=p.indexOf("/PollaProdes/")===0?"/PollaProdes/":"/";
var resto=decodeURIComponent(p.slice(base.length)).replace(/\/$/,"");
if(/^[A-Za-z0-9_-]{3,16}$/.test(resto))location.replace(base+"?e="+encodeURIComponent(resto));})();
</script>
